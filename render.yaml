# ============================================
# BASE DE DONNÉES (PostgreSQL) - Déployée EN PREMIER
# ============================================
databases:
  - name: my-cinema-db
    databaseName: my_cinema
    plan: free
    region: oregon

# ============================================
# SERVICES WEB
# ============================================
services:
  # --- BACKEND PHP (Déployé après la DB) ---
  - type: web
    name: my-cinema-api
    env: docker
    plan: free
    region: frankfurt  # Même région que la DB pour la latence
    rootDir: backend
    dockerfilePath: ./Dockerfile
    
    # 🔗 Dépendances : Attend que la DB soit prête
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-cinema-db
          property: connectionString
      - key: APP_ENV
        value: production
    
    # Health check (optionnel)
    healthCheckPath: /

  # --- FRONTEND (Déployé après le backend) ---
  - type: web
    name: my-cinema-frontend
    env: node
    plan: free
    region: frankfurt  # Même région
    rootDir: frontend  # ⬅️ Spécifie le dossier si nécessaire
    
    buildCommand: npm install && npm run build
    startCommand: npm start
    
    envVars:
      - key: REACT_APP_API_URL
        # Utilise le service backend déployé
        value: https://my-cinema-api.onrender.com
      - key: NODE_ENV
        value: production