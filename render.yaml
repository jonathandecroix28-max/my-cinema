services:
  # --- BACKEND PHP avec Docker ---
  - type: web
    name: my-cinema-api
    env: docker  # ⬅️ CHANGÉ de "php" à "docker"
    plan: free
    rootDir: backend  # ⬅️ IMPORTANT : pointe sur le dossier backend
    dockerfilePath: ./Dockerfile  # ⬅️ Chemin vers le Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-cinema-db
          property: connectionString
      - key: APP_ENV
        value: production

  # --- FRONTEND NODE ---
  - type: web
    name: my-cinema-frontend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: REACT_APP_API_URL
        value: https://my-cinema-api.onrender.com

# --- BASE DE DONNÉES PostgreSQL ---
databases:
  - name: my-cinema-db
    plan: free