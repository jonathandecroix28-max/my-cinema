# ============================================
# BASE DE DONNÉES (PostgreSQL) - Déployée EN PREMIER
# ============================================
databases:
  - name: my-cinema-db
    databaseName: my_cinema
    plan: free
    region: oregon

# ============================================
# SERVICES WEB
# ============================================
services:
  # --- BACKEND PHP (Déployé après la DB) ---
  - type: web
    name: my-cinema-api
    env: docker
    plan: free
    region: oregon  # Même région que la DB pour la latence
    rootDir: backend
    dockerfilePath: ./Dockerfile
    
    # 🔗 Dépendances : Attend que la DB soit prête
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-cinema-db
          property: connectionString
      - key: APP_ENV
        value: production
    
    # Health check (optionnel)
    healthCheckPath: /

  # --- FRONTEND (Déployé après le backend) ---
  - type: static
    name: my-cinema-frontend
    plan: free
    region: oregon  # Même région que le backend pour la latence
    buildCommand: echo "No build needed - serving static files"
    staticPublishPath: ./frontend
    routes:
      - type: rewrite
        source: /*
        destination: /html/index.html
    headers:
      - path: /**/*.css
        name: Content-Type
        value: text/css
      - path: /**/*.js
        name: Content-Type
        value: application/javascript
      - path: /**/*.html
        name: Content-Type
        value: text/html