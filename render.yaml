services:
  - type: web
    name: my-cinema
    runtime: docker
    dockerContext: my-cinema
    dockerfilePath: my-cinema/Dockerfile
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /backend/index.php?action=health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_CHARSET
        value: utf8mb4
