services:
  # --- BACKEND PHP MVC ---
  - type: web
    name: my-cinema-api
    env: php
    plan: free
    buildCommand: composer install
    # On pointe directement sur le dossier public
    startCommand: apache2-foreground 
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-cinema-db
          property: connectionString

  # --- FRONTEND NODE ---
  - type: web
    name: my-cinema-frontend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: REACT_APP_API_URL # Exemple pour lier au back
        value: https://my-cinema-api.onrender.com

# --- BASE DE DONNÉES (PostgreSQL par défaut sur Render) ---
databases:
  - name: my-cinema-db
    plan: free