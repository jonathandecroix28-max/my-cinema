<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗑️ Corbeille - Salles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html"><i class="bi bi-film me-2 fs-3"></i> My-Cinema</a>
            <div class="navbar-nav">
                <a class="nav-link" href="rooms.html">← Retour aux salles</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h2 class="mb-0">🗑️ Corbeille des Salles</h2>
                <p class="mb-0 small">Salles supprimées - Peuvent être restaurées ou supprimées définitivement</p>
            </div>
            <div class="card-body">
                <div id="trashStats" class="alert alert-info">
                    Chargement...
                </div>

                <table class="table table-bordered table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th class="text-center">ID</th>
                            <th>Nom</th>
                            <th class="text-center">Capacité</th>
                            <th class="text-center">Type</th>
                            <th class="text-center">Supprimé le</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="trashTableBody">
                        <tr>
                            <td colspan="6" class="text-center">Chargement...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="../assets/js/room-trash.js"></script>
</body>

</html>
