<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🗑️ Corbeille - Salles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- Admin Protection CSS -->
    <style>
        .admin-only {
            display: none;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-lg sticky-top">
        <div class="container-fluid">
            <!-- Logo -->
            <a class="navbar-brand d-flex align-items-center" href="index.html">
                <i class="bi bi-film me-2 fs-4"></i>
                <span class="fw-bold">My-Cinema</span>
            </a>

            <!-- Mobile Toggle -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Navigation -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Menu principal (centré sur desktop) -->
                <ul class="navbar-nav mx-auto">


                    <li class="nav-item">
                        <a class="nav-link active" href="rooms.html">
                            <i class="bi bi-arrow-left me-1"></i>Revenir aux Salles
                        </a>
                    </li>

                </ul>

                <!-- Badge utilisateur (à droite) -->
                <div id="user-badge" class="d-flex align-items-center"></div>
            </div>
        </div>
    </nav>


    <!-- CONTENU -->

    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-danger text-white">
                <h2 class="mb-0">🗑️ Corbeille des Salles</h2>
                <p class="mb-0 small">Salles supprimées - Peuvent être restaurées ou supprimées définitivement</p>
            </div>
            <div class="card-body">
                <div id="trashStats" class="alert alert-info">
                    Chargement...
                </div>

                <table class="table table-bordered table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th class="text-center">ID</th>
                            <th>Nom</th>
                            <th class="text-center">Capacité</th>
                            <th class="text-center">Type</th>
                            <th class="text-center">Supprimé le</th>
                            <th class="text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="trashTableBody">
                        <tr>
                            <td colspan="6" class="text-center">Chargement...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>


    <!-- SCRIPTS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./assets/js/room-trash.js"></script>
</body>

</html>
