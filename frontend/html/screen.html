<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="icon" type="image/png" href="../assets/favicon.png" />
    <title>My-Cinema - Séances</title>
</head>

<body class="bg-dark text-white">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-3 border-secondary">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">My-Cinema</a>
                <button class="btn-sm btn-success navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                    aria-label="Toggle navigation" style="display: none">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="movies.html">Films</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="rooms.html">Salles</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="screen.html">Séances</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container mt-4 px-10">
        <section class="container mt-4 col-12">
            <h1 class="text-center mb-4" id="titre">Gestion des Séances</h1>

            <div class="container mt-4 d-flex flex-row gap-5 justify-content-center item-align-center">
                <div class="container mt-4">
                    <div class="d-flex justify-content-center gap-3">
                        <form class="form" id="screeningForm">
                            <h3>Créer une nouvelle séance</h3>

                            <label class="form-label">Film</label>
                            <select class="form-select form-select-sm mb-3" id="movieSelect" name="movie" required>
                                <option value="">Sélectionnez un film...</option>
                            </select>

                            <label class="form-label">Salle</label>
                            <select class="form-select form-select-sm mb-3" id="roomSelect" name="room" required>
                                <option value="">Sélectionnez une salle...</option>
                            </select>

                            <label class="form-label">Date et heure de début</label>
                            <input class="form-control form-control-sm" type="datetime-local" id="startTime"
                                name="start_time" required>

                            <div class="d-flex justify-content-center mt-3">
                                <button class="btn-sm btn-success rounded-4 w-75 py-2" type="submit"
                                    style="border: none;">
                                    <i class="bi bi-plus-lg"></i> Créer la séance
                                </button>
                            </div>





                        </form>
                    </div>
                </div>
            </div>
        </section>

        <section class="container mt-4 col-12">
            <div class="container mt-4">
                <h2 class="text-center mb-4">Liste des séances programmées</h2>
                <div id="screeningsList" class="d-flex flex-wrap justify-content-center gap-3"></div>
                <div id="pagination-container" class="d-flex justify-content-center align-items-center gap-3 mt-4">
                    <button id="btn-prev" class="btn btn-outline-primary"><i class="bi bi-arrow-left"></i></button>
                    <span id="page-info" class="fw-bold"></span>
                    <button id="btn-next" class="btn btn-outline-primary"><i class="bi bi-arrow-right"></i></button>
                </div>
            </div>
        </section>
    </main>

    <footer class="text-center mt-4 mb-4">
        &copy; 2024 My-Cinema. Tous droits réservés.
    </footer>

    <script type="module" defer src="../screen.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
