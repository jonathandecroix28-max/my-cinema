<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="icon" type="image/png" href="../assets/favicon.png" />
    <title>My-Cinema</title>
</head>

<body class="bg-dark text-white">
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-3 border-secondary">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">My-Cinema</a>
                <button class="btn-sm btn-success" class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                    aria-label="Toggle navigation" style="display: none">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="movies.html">Films</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="rooms.html">Salles</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="screen.html">Séances</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container mt-4 px-10">
        <section class="container mt-4 col-12" data-display="block">
            <h1 class="text-center mb-4" id="titre"></h1>
            <div class="container mt-4 d-flex flex-row gap-5 justify-content-center item-align-center">


                <div class="container mt-4 ">
                    <div class="d-flex justify-content-center gap-3">
                        <form class="form" id="addMovieForm">
                            <h3>Ajouter un nouveau film</h3>
                            <label class="form-label">Titre</label>
                            <input class="form-control form-control-sm" type="text" list="listTitle" name="title"
                                id="movieTitle" required>

                            <datalist id="listTitle"></datalist>

                            <label class="form-label">Description</label>
                            <textarea class="form-control form-control-sm mb-4" name="summary" id="movieSummary"
                                rows="5" required></textarea>
                            <div class=" d-flex gap-3 justify-content-center">
                                <div class="">
                                    <label class="form-label" for="movieDuration">Durée (minutes)</label>
                                    <input class="form-control form-control-sm w-100" type="number" name="duration"
                                        id="movieDuration" inputmode="numeric">
                                </div>
                                <div class="">
                                    <label class="form-label">Année de sortie</label>
                                    <input class="form-control form-control-sm w-100" type="number" name="release_year"
                                        inputmode="numeric" id="movieReleaseYear" required>
                                </div>
                            </div>

                            <label class="form-label">Genre</label>
                            <input type="text" id="movieGenre" list="genreList" class="form-control">

                            <datalist id="genreList">
                            </datalist>

                            <label class="form-label">Réalisateur</label>
                            <input class="form-control form-control-sm" type="text" name="director" id="movieDirector"
                                required>
                            <div class="d-flex justify-content-center mt-3 btn-success">
                                <button class="btn-sm btn-success rounded-4 w-50 py-2" type="submit"
                                    style="border: none;"><i class="bi bi-plus-lg"></i>Ajouter un
                                    film</button>
                            </div>
                            <div id="stockMovie" class="mt-3 text-center"></div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
        <div id="stockBouton"></div>
        <section class="container mt-4 col-12">
            <div class="container mt-4 ">
                <h2 class="text-center mb-4">Listes des films et salles</h2>
                <div id="screeningsList" class="d-flex flex-wrap justify-content-center gap-3"></div>

            </div>
            <div class="pagination-controls d-flex justify-content-center align-items-center gap-3 mt-4">
                <button id="btnPrevMovie" class="btn btn-secondary">
                    <i class="bi bi-chevron-left"></i> Précédent
                </button>
                <span id="pageInfoMovie" class="text-white">Page 1 sur 1</span>
                <button id="btnNextMovie" class="btn btn-secondary">
                    Suivant <i class="bi bi-chevron-right"></i>
                </button>
            </div>
            </div>
        </section>
    </main>
    <footer class="text-center mt-4 mb-4">
        &copy; 2024 My-Cinema. Tous droits réservés.
    </footer>
    <script type="module" defer src="../movie.js"></script>
    <script src="../css.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
